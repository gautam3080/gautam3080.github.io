<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Off the map | Gautam</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#efe6d2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* 404: the same inked paper map as the home page, with a route that runs off the edge. */
:root {
  --paper: #efe6d2; --paper-2: #f7f1e3; --sea: #dfe8e2; --ink: #1f1b16; --ink-2: #4f473c; --verm: #c8402a; --verm-t: #a8331f; --teal: #1d6a66;
  --f-display: "Archivo Black", "Arial Black", Impact, sans-serif;
  --f-body: "Archivo", "Segoe UI", system-ui, sans-serif;
  --f-mono: "DM Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center;
  padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  color: var(--ink); font-family: var(--f-body); line-height: 1.6;
  background-color: var(--paper);
  background-image: linear-gradient(rgba(31,27,22,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(31,27,22,.045) 1px, transparent 1px);
  background-size: 96px 96px;
}
:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }
main { width: 100%; max-width: 640px; background: var(--paper-2); border: 2px solid var(--ink); box-shadow: 8px 8px 0 var(--ink); }
.chart { display: block; width: 100%; height: auto; border-bottom: 2px solid var(--ink); }
.text { padding: 26px 24px 30px; display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
.eyebrow { margin: 0; font-family: var(--f-mono); font-size: .84rem; letter-spacing: .12em; text-transform: uppercase; color: var(--verm-t); }
h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(2.2rem, 8vw, 3.4rem); line-height: 1.02; }
p { margin: 0; color: var(--ink-2); font-size: 1.08rem; }
.btns { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 8px; }
.btn { font-family: var(--f-display); font-size: .95rem; text-decoration: none; min-height: 48px; padding: 12px 20px; border: 2px solid var(--ink); display: inline-flex; align-items: center; background: var(--paper-2); color: var(--ink); box-shadow: 4px 4px 0 var(--ink); transition: transform .1s ease, box-shadow .1s ease; }
.btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
.btn-primary { background: var(--verm); color: #fff; }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
<main>
  <svg class="chart" viewBox="0 0 640 240" aria-hidden="true">
    <defs><pattern id="w" width="44" height="26" patternUnits="userSpaceOnUse"><path d="M2 8 q5 -6 10 0 t10 0 M24 21 q5 -6 10 0 t10 0" fill="none" stroke="#b6cac2" stroke-width="1.6"/></pattern></defs>
    <rect width="640" height="240" fill="#dfe8e2"/><rect width="640" height="240" fill="url(#w)"/>
    <path d="M118 150 L104 118 L120 84 L162 70 L204 82 L222 116 L208 152 L170 168 Z" transform="translate(7 7)" fill="#1f1b16"/>
    <path d="M118 150 L104 118 L120 84 L162 70 L204 82 L222 116 L208 152 L170 168 Z" fill="#f4ecd9" stroke="#1f1b16" stroke-width="3"/>
    <circle cx="165" cy="124" r="13" fill="#f7f1e3" stroke="#1f1b16" stroke-width="3"/>
    <path d="M178 124 C 260 120, 300 190, 380 160 S 500 60, 560 110 S 620 200, 660 170" fill="none" stroke="#c8402a" stroke-width="4" stroke-dasharray="11 8" stroke-linecap="round"/>
    <g transform="translate(560 110)"><path d="M0 0 C-4 -10 -13 -16 -13 -27 a13 13 0 0 1 26 0 C13 -16 4 -10 0 0Z" fill="#c8402a" stroke="#1f1b16" stroke-width="3"/><circle cx="0" cy="-27" r="5" fill="#f7f1e3" stroke="#1f1b16" stroke-width="2"/></g>
    <text x="586" y="70" font-family="Archivo Black, sans-serif" font-size="40" fill="#1f1b16">?</text>
  </svg>
  <div class="text">
    <p class="eyebrow">404 · Uncharted waters</p>
    <h1>Off the map.</h1>
    <p>This page isn't on any route. The levels are all back on the world map.</p>
    <div class="btns">
      <a class="btn btn-primary" href="/">Back to the map</a>
      <a class="btn" href="/#contact">Contact</a>
    </div>
  </div>
</main>
</body>
</html>
