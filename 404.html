<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found | Gautam</title>
<meta name="theme-color" content="#191919">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* 404 in the same Unity Editor look as the main page: a single Console window reporting the missing page. */
:root { --bg0: #191919; --bg1: #232323; --bg2: #282828; --bg3: #3c3c3c; --sep: #121212; --sel: #2c5d87; --text: #d2d2d2; --bright: #ececec; --muted: #a0a0a0; --red: #e8564a; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { min-height: 100vh; min-height: 100dvh; background: var(--bg0); color: var(--text); font: 14px/1.55 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; display: grid; place-items: center; padding: 16px; }
:focus-visible { outline: 2px solid #e0b341; outline-offset: 1px; }
.win { width: min(640px, 100%); background: var(--bg2); border: 2px solid var(--sep); border-radius: 4px; overflow: hidden; }
.tabs { background: var(--bg0); height: 30px; display: flex; align-items: flex-end; padding-left: 2px; }
.tab { height: 28px; display: inline-flex; align-items: center; padding: 0 12px; font-size: 12.5px; color: var(--bright); background: var(--bg2); border-radius: 3px 3px 0 0; box-shadow: inset 0 2px 0 var(--red); }
.bar { display: flex; justify-content: flex-end; gap: 10px; padding: 4px 10px; border-bottom: 1px solid var(--sep); font: 11.5px "JetBrains Mono", ui-monospace, monospace; color: var(--muted); }
.bar b { color: var(--red); font-weight: 500; }
.log { display: grid; grid-template-columns: 18px 1fr; gap: 10px; padding: 14px 14px 10px; background: #2b2b2b; border-bottom: 1px solid var(--sep); }
.log svg { width: 16px; height: 16px; margin-top: 3px; }
.log h1 { margin: 0 0 4px; font-size: 20px; font-weight: 600; color: var(--bright); line-height: 1.3; }
.log p { margin: 0; color: var(--text); }
.trace { margin: 0; padding: 10px 14px 14px 42px; font: 12px/1.6 "JetBrains Mono", ui-monospace, monospace; color: var(--muted); overflow-wrap: anywhere; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 16px 42px; }
.btn { display: inline-flex; align-items: center; min-height: 44px; padding: 6px 14px; font-size: 13px; font-weight: 500; text-decoration: none; color: var(--bright); background: var(--bg3); border: 1px solid var(--sep); border-radius: 3px; }
.btn:hover { background: #4a4a4a; }
.btn.primary { background: var(--sel); color: #fff; }
.btn.primary:hover { background: #356ea0; }
</style>
</head>
<body>
<main class="win">
  <div class="tabs"><span class="tab">Console</span></div>
  <div class="bar"><span>0 info</span><span>0 warnings</span><b>1 error</b></div>
  <div class="log">
    <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="#e8564a"/><path d="M5.6 5.6l4.8 4.8M10.4 5.6l-4.8 4.8" stroke="#232323" stroke-width="1.8" stroke-linecap="round"/></svg>
    <div>
      <h1>404: page not found</h1>
      <p>MissingReferenceException: this page doesn't exist in the scene.</p>
    </div>
  </div>
  <p class="trace">at Portfolio.Load (path)<br>at gautam.unity</p>
  <div class="acts">
    <a class="btn primary" href="/">Back to the scene</a>
    <a class="btn" href="/#contact">Contact</a>
  </div>
</main>
</body>
</html>
