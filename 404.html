<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scene missing | Gautam</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root { --bg: #0a0a0a; --line: #262523; --line-2: #3a3935; --text: #f2f0ea; --muted: #a8a59c; --amber: #ffb000; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; grid-template-rows: auto 1fr auto; background: var(--bg); color: var(--text); font-family: "IBM Plex Sans", system-ui, sans-serif; line-height: 1.6; }
.bar { height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
.bar.bottom { border-bottom: 0; border-top: 1px solid var(--line); }
.mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.tc { color: var(--amber); }
a.brand { font-family: "Anton", Impact, sans-serif; font-size: 1.35rem; text-transform: uppercase; letter-spacing: .04em; color: var(--text); text-decoration: none; min-height: 44px; display: flex; align-items: center; }
main { display: grid; place-items: center; text-align: center; padding: 48px 16px; }
h1 { font-family: "Anton", Impact, sans-serif; font-weight: 400; text-transform: uppercase; line-height: .95; font-size: clamp(3.2rem, 12vw, 10rem); margin: 18px 0 16px; }
p { margin: 0; color: var(--muted); }
.btn { display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; margin-top: 32px; background: var(--amber); color: var(--bg); text-decoration: none; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: .82rem; letter-spacing: .1em; text-transform: uppercase; }
.btn:hover { background: var(--text); }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
</style>
</head>
<body>
<header class="bar"><a class="brand" href="/">Gautam</a><span class="mono tc">ERR 404 · 00:00:00:00</span></header>
<main>
  <div>
    <p class="mono">Reel · Scene ?? · Take 00</p>
    <h1>Scene missing.</h1>
    <p>This page was cut from the reel.</p>
    <a class="btn" href="/">Back to the reel</a>
  </div>
</main>
<footer class="bar bottom"><span class="mono">© 2026 Gautam · Unity Game Developer</span></footer>
</body>
</html>
